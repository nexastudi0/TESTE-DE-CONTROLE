<!DOCTYPE html>
<html lang="pt-BR">

  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Nexa Vet Control" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-180.png" />

  <link rel="icon" sizes="96x96" href="assets/icon-96.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script defer src="effects3d.js"></script>

<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-glow"></div>

  <div id="app" aria-live="polite"></div>
  <div id="toast-area" aria-live="assertive"></div>
  <div id="connection-banner" role="status" aria-live="polite" hidden></div>
  <div id="modal-root"></div>
